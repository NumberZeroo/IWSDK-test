<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Efesto Uploader | 3D Workspace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        body { background-color: #0a0a0a; color: #e5e7eb; font-family: 'Inter', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #121212; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
        model-viewer { width: 100%; height: 100%; --poster-color: transparent; }
        .glass { background: rgba(25, 25, 25, 0.7); backdrop-filter: blur(16px); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .animate-in { animation: fadeIn 0.3s ease-out forwards; }
        .tab-active { color: white; border-bottom: 2px solid #ef4444; }
    </style>
</head>

<body class="h-screen overflow-hidden flex flex-col">

    <div id="main-app" class="h-screen flex flex-col md:flex-row w-full">
        <aside class="w-full md:w-80 lg:w-96 bg-[#0e0e0e] border-r border-neutral-900 flex flex-col h-full z-20">
            <div class="p-6 pb-0">
                <div class="flex items-center gap-3 mb-6">
                    <div class="w-8 h-8 rounded-lg overflow-hidden flex items-center justify-center">
                        <img src="logo.png" alt="Efesto" class="w-full h-full object-cover">
                    </div>
                    <h1 class="text-lg font-black text-white tracking-tighter uppercase">Efesto</h1>
                </div>

                <div class="flex border-b border-neutral-900 mb-6">
                    <button onclick="switchTab('upload')" id="tab-upload"
                        class="flex-1 py-3 text-[10px] font-black uppercase tracking-widest text-neutral-500 hover:text-neutral-300 transition-all tab-active">
                        Uploader
                    </button>
                    <button onclick="switchTab('generate')" id="tab-generate"
                        class="flex-1 py-3 text-[10px] font-black uppercase tracking-widest text-neutral-500 hover:text-neutral-300 transition-all">
                        Generator
                    </button>
                </div>

                <div id="sidebar-context" class="mb-6">
                    <p id="mode-desc" class="text-[9px] text-neutral-500 font-bold uppercase tracking-[0.2em]">Local Asset Management</p>
                </div>

                <div id="upload-controls" class="animate-in">
                    <div id="drop-zone" class="border-2 border-dashed border-neutral-800 rounded-2xl p-6 text-center hover:border-red-500 hover:bg-red-500/5 transition-all cursor-pointer group mb-6">
                        <input type="file" id="file-input" accept=".glb" class="hidden" multiple>
                        <div class="w-10 h-10 bg-neutral-900 rounded-full flex items-center justify-center mx-auto mb-3 group-hover:scale-110 transition-transform">
                            <svg class="text-neutral-500 group-hover:text-red-500" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                <polyline points="17 8 12 3 7 8"></polyline>
                                <line x1="12" y1="3" x2="12" y2="15"></line>
                            </svg>
                        </div>
                        <p class="text-[10px] font-bold text-neutral-500 uppercase">Drop .GLB files here</p>
                    </div>
                </div>

                <div id="ai-controls" class="hidden animate-in">
                    <div class="space-y-3 mb-6">
                        <textarea id="ai-prompt" placeholder="e.g. A futuristic engine turbine..."
                            class="w-full bg-neutral-900 border border-neutral-800 rounded-xl p-4 text-xs text-white focus:outline-none focus:border-red-500 transition-colors resize-none h-24 placeholder-neutral-700"></textarea>
                        <button id="generate-btn" onclick="simulateGeneration()"
                            class="w-full bg-red-600 hover:bg-red-500 text-white font-bold py-3.5 rounded-xl text-[10px] uppercase tracking-widest transition-all flex items-center justify-center gap-2 shadow-lg shadow-red-900/20">
                            <span>Initialize Synthesis</span>
                        </button>
                    </div>
                </div>
                <div class="h-px bg-neutral-900 w-full mb-6"></div>
            </div>

            <div class="flex-1 overflow-y-auto px-6 pb-6 custom-scrollbar">
                <h2 class="text-[10px] font-black text-neutral-600 uppercase tracking-[0.25em] mb-4">Workspace Library</h2>
                <div id="file-list" class="space-y-2"></div>
            </div>
        </aside>

        <main class="flex-1 relative bg-black flex items-center justify-center">
            <div id="viewer-header" class="hidden absolute top-0 left-0 right-0 p-8 z-10 flex justify-between items-start pointer-events-none">
                <div class="glass p-5 rounded-2xl border border-white/5 shadow-2xl pointer-events-auto">
                    <h3 id="current-filename" class="text-xl font-black text-white truncate max-w-xs uppercase tracking-tighter">Model Name</h3>
                </div>
                <button onclick="closePreview()" class="bg-white/5 hover:bg-red-600 p-3 rounded-xl border border-white/10 backdrop-blur-md transition-all group pointer-events-auto">
                    <svg class="text-white" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>

            <div id="empty-state" class="text-center opacity-20">
                <div class="w-24 h-24 border-2 border-neutral-800 rounded-full flex items-center justify-center mx-auto mb-4">
                    <svg class="text-neutral-500" xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                    </svg>
                </div>
                <h2 class="text-lg font-bold text-neutral-500 uppercase tracking-widest">Viewport Standby</h2>
            </div>

            <div id="viewer-container" class="hidden w-full h-full">
                <model-viewer id="main-viewer" src="" ar camera-controls auto-rotate shadow-intensity="1" environment-image="neutral" exposure="1" interaction-prompt="none"></model-viewer>
                <div class="absolute bottom-10 left-1/2 -translate-x-1/2 glass px-6 py-3 rounded-full text-[10px] font-black text-neutral-400 border border-white/5 shadow-2xl flex gap-8 uppercase tracking-widest">
                    <span class="flex items-center gap-2"><span class="w-1.5 h-1.5 bg-red-600 rounded-full"></span> Orbit</span>
                    <span class="flex items-center gap-2"><span class="w-1.5 h-1.5 bg-red-600 rounded-full"></span> Pinch</span>
                    <span class="flex items-center gap-2"><span class="w-1.5 h-1.5 bg-red-600 rounded-full"></span> Pan</span>
                </div>
            </div>
        </main>
    </div>

    <script>
        let files = [];
        let currentMode = 'upload';

        const uploadControls = document.getElementById('upload-controls');
        const aiControls = document.getElementById('ai-controls');
        const modeDesc = document.getElementById('mode-desc');
        const tabUpload = document.getElementById('tab-upload');
        const tabGenerate = document.getElementById('tab-generate');
        const fileListElement = document.getElementById('file-list');
        const fileInput = document.getElementById('file-input');
        const dropZone = document.getElementById('drop-zone');
        const viewerContainer = document.getElementById('viewer-container');
        const viewerHeader = document.getElementById('viewer-header');
        const emptyState = document.getElementById('empty-state');
        const mainViewer = document.getElementById('main-viewer');
        const currentFileNameDisplay = document.getElementById('current-filename');

        function switchTab(mode) {
            currentMode = mode;
            if (mode === 'upload') {
                uploadControls.classList.remove('hidden');
                aiControls.classList.add('hidden');
                modeDesc.textContent = "Local Asset Management";
                tabUpload.classList.add('tab-active');
                tabGenerate.classList.remove('tab-active');
            } else {
                aiControls.classList.remove('hidden');
                uploadControls.classList.add('hidden');
                modeDesc.textContent = "Neural Synthesis Engine";
                tabGenerate.classList.add('tab-active');
                tabUpload.classList.remove('tab-active');
            }
            renderFileList();
        }

        window.addEventListener('DOMContentLoaded', loadLibraryFromServer);

        async function loadLibraryFromServer() {
            try {
                files = [];
                const presetRes = await fetch('http://localhost:5000/presets');
                if (presetRes.ok) {
                    const presets = await presetRes.json();
                    presets.forEach(p => {
                        files.push({ id: p.id, name: p.id, size: 'PRESET', url: `http://localhost:5000/presets/${p.id}`, type: 'upload' });
                    });
                }
                const modelRes = await fetch('http://localhost:5000/models');
                if (modelRes.ok) {
                    const models = await modelRes.json();
                    models.forEach(m => {
                        files.push({ id: m.id, name: m.name + ".glb", size: m.size, url: `http://localhost:5000/models/${m.id}`, type: 'generate' });
                    });
                }
                renderFileList();
            } catch (error) {
                console.error("Errore nel caricamento della libreria:", error);
            }
        }

        dropZone.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('border-red-500'); });
        dropZone.addEventListener('dragleave', () => { dropZone.classList.remove('border-red-500'); });
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('border-red-500');
            handleFiles(e.dataTransfer.files);
        });
        fileInput.addEventListener('change', (e) => handleFiles(e.target.files));

        async function handleFiles(incomingFiles) {
            const glbFiles = Array.from(incomingFiles).filter(f => f.name.toLowerCase().endsWith('.glb'));
            for (const file of glbFiles) {
                const formData = new FormData();
                formData.append('file', file);
                try {
                    const response = await fetch('http://localhost:5000/presets/upload', { method: 'POST', body: formData });
                    if (response.ok) {
                        files.push({
                            id: file.name,
                            name: file.name,
                            size: (file.size / 1024 / 1024).toFixed(1) + 'MB',
                            url: `http://localhost:5000/presets/${file.name}`,
                            type: 'upload'
                        });
                    }
                } catch (e) { console.error("Upload error", e); }
            }
            renderFileList();
        }

        // --- FUNZIONI RINOMINA ---
        function focusRename(id) {
            const input = document.getElementById(`input-${id}`);
            if (input) {
                input.readOnly = false;
                input.classList.remove('pointer-events-none', 'cursor-default');
                input.classList.add('cursor-text', 'bg-white/10');
                input.focus();
                input.select();
            }
        }

        function disableRename(id) {
            const input = document.getElementById(`input-${id}`);
            if (input) {
                input.readOnly = true;
                input.classList.add('pointer-events-none', 'cursor-default');
                input.classList.remove('cursor-text', 'bg-white/10');
            }
        }

        async function renameFile(id, newName) {
            const file = files.find(f => f.id === id);
            if (!file || !newName || newName === file.name) return;

            if (file.type === 'upload') {
                try {
                    const response = await fetch('http://localhost:5000/presets/rename', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ oldId: file.id, newName: newName })
                    });

                    const data = await response.json();

                    if (response.ok) {
                        // Aggiorniamo i dati locali con il nuovo ID
                        file.name = data.newId;
                        file.id = data.newId;
                        file.url = `http://localhost:5000/presets/${data.newId}`;
                        console.log("Rinominato con successo");
                    } else {
                        alert("Errore: " + data.error);
                        renderFileList(); // Reset della UI al nome precedente
                        return;
                    }
                } catch (error) {
                    console.error("Errore di rete:", error);
                    alert("Errore di connessione al server");
                }
            } else {
                file.name = newName.toLowerCase().endsWith('.glb') ? newName : newName + '.glb';
            }

            if (mainViewer.src === file.url) {
                currentFileNameDisplay.textContent = file.name;
            }
            renderFileList();
        }

        function renderFileList() {
            fileListElement.innerHTML = '';
            const filteredFiles = files.filter(f => f.type === currentMode);

            filteredFiles.forEach(file => {
                const isActive = mainViewer.src === file.url;
                const div = document.createElement('div');
                div.className = `group p-3 rounded-xl cursor-pointer border transition-all ${isActive ? 'bg-red-600 border-red-500' : 'bg-neutral-900 border-neutral-800 hover:border-neutral-700'}`;
                div.onclick = () => showPreview(file);

                const icon = file.type === 'generate'
                    ? `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"></path><path d="M5 3v4"></path><path d="M19 17v4"></path><path d="M3 5h4"></path><path d="M17 19h4"></path></svg>`
                    : `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>`;

                div.innerHTML = `
                    <div class="flex items-center gap-3">
                        <div class="text-white opacity-60">${icon}</div>
                        <div class="flex-1 overflow-hidden">
                            <input type="text" id="input-${file.id}" value="${file.name}"
                                class="bg-transparent border-none p-0 text-[11px] font-bold text-white w-full focus:ring-1 focus:ring-white/20 rounded focus:outline-none uppercase tracking-tight cursor-default pointer-events-none transition-colors"
                                readonly 
                                onclick="event.stopPropagation()"
                                onblur="disableRename('${file.id}')"
                                onchange="renameFile('${file.id}', this.value)"
                                onkeydown="if(event.key==='Enter') this.blur()">
                            <p class="text-[9px] font-bold text-neutral-500 uppercase">${file.size} • ${file.type}</p>
                        </div>
                        <div class="flex items-center gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
                            <button onclick="event.stopPropagation(); focusRename('${file.id}')" title="Rename" class="text-neutral-400 hover:text-white p-1">
                                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 1 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                            </button>
                            <button onclick="event.stopPropagation(); downloadFile('${file.id}')" title="Download" class="text-neutral-400 hover:text-white p-1">
                                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                            </button>
                            <button onclick="event.stopPropagation(); deleteFile('${file.id}')" title="Delete" class="text-neutral-400 hover:text-white p-1">
                                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                            </button>
                        </div>
                    </div>
                `;
                fileListElement.appendChild(div);
            });
        }

        async function simulateGeneration() {
            const promptInput = document.getElementById('ai-prompt');
            const prompt = promptInput.value;
            if (!prompt) return;
            const btn = document.getElementById('generate-btn');
            const originalContent = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = `<span class="animate-pulse">Synthesizing...</span>`;

            try {
                const response = await fetch('http://localhost:5000/generate3dOnly', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: prompt })
                });
                if (!response.ok) throw new Error('Generazione fallita');
                const blob = await response.blob();
                const modelId = response.headers.get('X-Model-Id') || Date.now().toString();
                const newFile = {
                    id: modelId,
                    name: `AI_${prompt.slice(0, 10).replace(/\s/g, '_')}.glb`,
                    size: (blob.size / 1024 / 1024).toFixed(1) + 'MB',
                    url: `http://localhost:5000/models/${modelId}`,
                    type: 'generate'
                };
                files.push(newFile);
                renderFileList();
                showPreview(newFile);
                promptInput.value = '';
            } catch (error) {
                alert("Errore di connessione al server Efesto.");
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalContent;
            }
        }

        function showPreview(file) {
            emptyState.classList.add('hidden');
            viewerContainer.classList.remove('hidden');
            viewerHeader.classList.remove('hidden');
            mainViewer.src = file.url;
            currentFileNameDisplay.textContent = file.name;
            renderFileList();
        }

        function closePreview() {
            viewerContainer.classList.add('hidden');
            viewerHeader.classList.add('hidden');
            emptyState.classList.remove('hidden');
            mainViewer.src = '';
            renderFileList();
        }

        async function deleteFile(id) {
            const file = files.find(f => f.id === id);
            if (!file) return;
            if (!confirm(`Vuoi eliminare definitivamente ${file.name}?`)) return;

            try {
                const endpoint = file.type === 'upload' 
                    ? `http://localhost:5000/presets/${file.id}` 
                    : `http://localhost:5000/models/${file.id}`;

                const response = await fetch(endpoint, { method: 'DELETE' });

                if (response.ok) {
                    if (mainViewer.src === file.url) closePreview();
                    files = files.filter(f => f.id !== id);
                    renderFileList();
                } else {
                    const err = await response.json();
                    alert("Errore: " + (err.error || "Server error"));
                }
            } catch (error) {
                alert("Errore di connessione.");
            }
        }

        function downloadFile(id) {
            const file = files.find(f => f.id === id);
            if (file) {
                const link = document.createElement('a');
                link.href = file.url;
                link.download = file.name;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }
        }
    </script>
</body>
</html>
