<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Efesto Uploader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Model Viewer for 3D rendering -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        body { background-color: #1a1a1a; color: #e5e7eb; }
        .custom-scrollbar::-webkit-scrollbar { width: 5px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #262626; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #404040; border-radius: 10px; }
        model-viewer { width: 100%; height: 100%; --poster-color: transparent; }
        .glass { background: rgba(38, 38, 38, 0.8); backdrop-filter: blur(12px); }
        .accent-red { color: #ef4444; }
        .bg-accent-red { background-color: #ef4444; }
        .border-accent-red { border-color: #ef4444; }
    </style>
</head>
<body class="h-screen overflow-hidden flex flex-col md:flex-row">

    <!-- Left Column: Management -->
    <aside class="w-full md:w-80 lg:w-96 bg-[#121212] border-r border-neutral-800 flex flex-col h-full shadow-2xl z-20">
        <!-- Logo Section -->
        <div class="p-6 pb-4">
            <div class="flex items-center gap-3 mb-8">
                <div class="w-10 h-10 rounded-lg overflow-hidden flex items-center justify-center bg-neutral-800">
                    <img src="logo.png" alt="Logo" class="w-full h-full object-contain" onerror="this.parentElement.innerHTML='<div class=\'bg-red-500 w-full h-full flex items-center justify-center font-bold text-white\'>3D</div>'">
                </div>
                <h1 class="text-2xl font-black text-white tracking-tighter uppercase">Efesto Uploader</h1>
            </div>

            <!-- Upload Area -->
            <label class="block text-xs font-bold text-neutral-500 uppercase tracking-widest mb-3 px-1">Upload File</label>
            <div id="drop-zone" class="border-2 border-dashed border-neutral-700 rounded-2xl p-6 text-center hover:border-red-500 hover:bg-red-500/5 transition-all cursor-pointer group mb-8">
                <input type="file" id="file-input" accept=".glb" class="hidden" multiple>
                <div class="w-12 h-12 bg-neutral-800 rounded-full flex items-center justify-center mx-auto mb-3 group-hover:scale-110 transition-transform">
                    <svg class="text-neutral-400 group-hover:text-red-500 transition-colors" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                </div>
                <p class="text-xs font-medium text-neutral-400 group-hover:text-neutral-200 transition-colors">Drag & drop or click for .GLB files</p>
            </div>
            
            <div class="h-px bg-neutral-800 w-full mb-6"></div>
        </div>

        <!-- File List Container -->
        <div class="flex-1 overflow-y-auto px-6 pb-6 custom-scrollbar">
            <h2 class="text-xs font-bold text-neutral-500 uppercase tracking-widest mb-4 px-1">Model Archive</h2>
            <div id="file-list" class="space-y-3">
                <!-- Files will be inserted here via JS -->
            </div>
        </div>
    </aside>

    <!-- Right Column: Viewer -->
    <main class="flex-1 relative bg-[#0a0a0a] flex items-center justify-center">
        <!-- Information Overlay (Only when a file is selected) -->
        <div id="viewer-header" class="hidden absolute top-0 left-0 right-0 p-8 z-10 bg-gradient-to-b from-black/80 to-transparent flex justify-between items-start">
            <div class="glass p-4 rounded-2xl border border-white/5 shadow-2xl">
                <h3 id="current-filename" class="text-xl font-bold text-white truncate max-w-md">Model Name</h3>
                <div class="flex items-center gap-2 mt-1">
                    <span class="w-2 h-2 bg-red-500 rounded-full animate-pulse"></span>
                    <p class="text-xs font-bold text-neutral-400 uppercase tracking-widest">Real-Time 3D Rendering</p>
                </div>
            </div>
            <button onclick="closePreview()" class="bg-white/5 hover:bg-red-500/20 p-3 rounded-xl border border-white/10 backdrop-blur-md transition-all group">
                <svg class="text-white group-hover:rotate-90 transition-transform" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
        </div>

        <!-- Empty State -->
        <div id="empty-state" class="text-center animate-pulse">
            <div class="w-32 h-32 bg-neutral-900/50 rounded-full flex items-center justify-center mx-auto mb-6 border border-neutral-800">
                <svg class="text-neutral-700" xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path></svg>
            </div>
            <h2 class="text-2xl font-light text-neutral-600">Select a model from the list</h2>
        </div>

        <!-- Model Viewer -->
        <div id="viewer-container" class="hidden w-full h-full">
            <model-viewer id="main-viewer" 
                src="" 
                ar 
                camera-controls 
                auto-rotate 
                shadow-intensity="2" 
                environment-image="neutral" 
                exposure="1" 
                interaction-prompt="auto">
            </model-viewer>

            <!-- Help Controls -->
            <div class="absolute bottom-10 left-1/2 -translate-x-1/2 glass px-6 py-3 rounded-2xl text-xs font-bold text-neutral-300 border border-white/5 shadow-2xl flex gap-6">
                <span class="flex items-center gap-2"><div class="w-2 h-2 bg-red-500 rounded-full"></div> Rotate</span>
                <span class="flex items-center gap-2"><div class="w-2 h-2 bg-red-500 rounded-full"></div> Zoom</span>
                <span class="flex items-center gap-2"><div class="w-2 h-2 bg-red-500 rounded-full"></div> Pan</span>
            </div>
        </div>
    </main>

    <script>
        let files = [];
        const fileListElement = document.getElementById('file-list');
        const fileInput = document.getElementById('file-input');
        const dropZone = document.getElementById('drop-zone');
        const viewerContainer = document.getElementById('viewer-container');
        const viewerHeader = document.getElementById('viewer-header');
        const emptyState = document.getElementById('empty-state');
        const mainViewer = document.getElementById('main-viewer');
        const currentFileNameDisplay = document.getElementById('current-filename');

        dropZone.addEventListener('click', () => fileInput.click());
        
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('border-red-500', 'bg-red-500/5');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('border-red-500', 'bg-red-500/5');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('border-red-500', 'bg-red-500/5');
            handleFiles(e.dataTransfer.files);
        });

        fileInput.addEventListener('change', (e) => {
            handleFiles(e.target.files);
        });

        function handleFiles(incomingFiles) {
            const glbFiles = Array.from(incomingFiles).filter(f => f.name.toLowerCase().endsWith('.glb'));
            
            if (glbFiles.length < incomingFiles.length) {
                alert("Only .glb files are supported.");
            }

            glbFiles.forEach(file => {
                const fileData = {
                    id: Date.now() + Math.random().toString(36).substr(2, 5),
                    name: file.name,
                    size: (file.size / 1024 / 1024).toFixed(2) + ' MB',
                    url: URL.createObjectURL(file)
                };
                files.push(fileData);
            });
            renderFileList();
        }

        function renderFileList() {
            fileListElement.innerHTML = '';
            files.forEach(file => {
                const isActive = mainViewer.src === file.url;
                const item = document.createElement('div');
                item.className = `group p-4 rounded-2xl transition-all cursor-pointer border flex flex-col gap-3 ${isActive ? 'bg-red-600 border-red-500 shadow-lg shadow-red-900/20' : 'bg-neutral-800/50 border-neutral-700/50 hover:border-neutral-500 hover:bg-neutral-800'}`;
                
                item.onclick = () => showPreview(file);
                
                item.innerHTML = `
                    <div class="flex items-center gap-3">
                        <div class="${isActive ? 'bg-white/20' : 'bg-neutral-900'} p-2 rounded-xl text-red-500">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path></svg>
                        </div>
                        <div class="flex-1 min-w-0">
                            <p class="text-sm font-bold truncate ${isActive ? 'text-white' : 'text-neutral-200'}">${file.name}</p>
                            <p class="text-[10px] font-bold uppercase tracking-wider ${isActive ? 'text-red-100' : 'text-neutral-500'}">${file.size}</p>
                        </div>
                    </div>
                    <div class="flex justify-end gap-2 pt-2 border-t ${isActive ? 'border-white/10' : 'border-neutral-700/50'}">
                        <button onclick="event.stopPropagation(); downloadFile('${file.id}')" class="p-2 rounded-lg hover:bg-white/10 text-neutral-400 hover:text-white transition-colors" title="Download">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                        </button>
                        <button onclick="event.stopPropagation(); renameFile('${file.id}')" class="p-2 rounded-lg hover:bg-white/10 text-neutral-400 hover:text-white transition-colors" title="Rename">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                        </button>
                        <button onclick="event.stopPropagation(); deleteFile('${file.id}')" class="p-2 rounded-lg hover:bg-red-700/20 text-neutral-400 hover:text-red-400 transition-colors" title="Delete">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                        </button>
                    </div>
                `;
                fileListElement.appendChild(item);
            });
        }

        function showPreview(file) {
            emptyState.classList.add('hidden');
            viewerContainer.classList.remove('hidden');
            viewerHeader.classList.remove('hidden');
            mainViewer.src = file.url;
            currentFileNameDisplay.textContent = file.name;
            renderFileList(); 
        }

        function closePreview() {
            viewerContainer.classList.add('hidden');
            viewerHeader.classList.add('hidden');
            emptyState.classList.remove('hidden');
            mainViewer.src = '';
            renderFileList();
        }

        function deleteFile(id) {
            if (confirm("Do you want to delete this file?")) {
                const file = files.find(f => f.id === id);
                if (mainViewer.src === file.url) closePreview();
                files = files.filter(f => f.id !== id);
                renderFileList();
            }
        }

        function renameFile(id) {
            const file = files.find(f => f.id === id);
            let newName = prompt("Enter new name:", file.name);
            if (newName && newName !== file.name) {
                if (!newName.toLowerCase().endsWith('.glb')) newName += '.glb';
                file.name = newName;
                if (mainViewer.src === file.url) currentFileNameDisplay.textContent = newName;
                renderFileList();
            }
        }

        function downloadFile(id) {
            const file = files.find(f => f.id === id);
            const a = document.createElement('a');
            a.href = file.url;
            a.download = file.name;
            a.click();
        }
    </script>
</body>
</html>
