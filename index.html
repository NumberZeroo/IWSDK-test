<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>IWSDK</title>

<style>
    body {
        margin: 0;
        background: #0a0a0a;
        background-image: url(logodef2.png);
        background-position: center;                
        background-repeat: no-repeat;                
        background-size: cover;                     
        height: 100vh;                             
        width: 100%;
        font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    #btn-container {
        position: fixed;
        top: 55%; 
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 1000;
        display: flex;
        gap: 25px;
    }

    button {
        padding: 18px 32px;
        /* Scurito: diminuita la trasparenza (0.4) e aggiunto un tocco di nero */
        background: rgba(10, 20, 50, 0.6); 
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        
        color: #ffffff;
        /* Bordo blu leggermente più sottile e definito */
        border: 1px solid rgba(47, 107, 255, 0.3);
        border-radius: 12px;
        
        font-size: 15px;
        font-weight: 800;
        letter-spacing: 2px;
        text-transform: uppercase;
        cursor: pointer;
        
        /* Ombra più scura e decisa */
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
        
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        position: relative;
        overflow: hidden;
    }

    /* Scia di luce al passaggio del mouse */
    button::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(
            120deg,
            transparent,
            rgba(47, 107, 255, 0.2),
            transparent
        );
        transition: all 0.6s;
    }

    button:hover {
        /* Al passaggio diventa un po' più chiaro per feedback */
        background: rgba(20, 40, 100, 0.8);
        border-color: rgba(47, 107, 255, 1);
        transform: translateY(-5px);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), 
                    0 0 20px rgba(47, 107, 255, 0.3);
    }

    button:hover::before {
        left: 100%;
    }

    button:active {
        transform: translateY(-2px);
        filter: brightness(0.8);
    }
</style>
  </head>

  <body style="margin: 0">
    <div id="btn-container">
      <button onclick="startModule('/src/index.ts')">VR VERSION</button>
      <button onclick="startModule('/src/arVersion.ts')">AR VERSION</button>
      <button onclick="window.location.href='/src/loadModels.html'">LOAD MODELS</button>
    </div>

    <div id="scene-container"></div>

    <script>
  function startModule(path) {
    // 1. Rimuove lo sfondo e resetta il colore del body
    // Questo è fondamentale per l'AR: senza sfondo il browser può mostrare la camera
    document.body.style.backgroundImage = "none";
    document.body.style.backgroundColor = "transparent"; 

    // 2. Rimuove eventuale script precedente
    const oldScript = document.getElementById('dynamic-module');
    if (oldScript) oldScript.remove();

    // 3. Crea il nuovo script dinamico
    const script = document.createElement('script');
    script.type = 'module';
    script.id = 'dynamic-module';
    script.src = path;
    document.body.appendChild(script);

    // 4. Nasconde i pulsanti
    document.getElementById('btn-container').style.display = 'none';
  }
</script>
  </body>
</html>
